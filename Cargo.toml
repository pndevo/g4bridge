[package]
name = "g4bridge"
version = "0.1.0"
edition = "2021"
description = "Use a GameSir G4 gamepad over Bluetooth on Windows (and Linux) via RFCOMM and a virtual Xbox 360 controller"
license = "MIT"
repository = "https://github.com/pndevo/g4bridge"
readme = "README.md"
keywords = ["gamesir", "bluetooth", "gamepad", "xinput", "vigem"]
categories = ["hardware-support"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Devices_Bluetooth",
    "Win32_System_Time",
] }
vigem-client = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
